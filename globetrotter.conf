server {
    listen 80;
    server_name _;  # Replace with your domain or VPS IP

    root /var/www/globetrotter-build/webpage;
    index index.html;

    # ─── Landing page (Flutter webpage, base-href /) ─────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Web app (Flutter web, base-href /app/) ───────────────────────────────
    location /app/ {
        alias /var/www/globetrotter-build/web/;
        try_files $uri $uri/ /app/index.html;
    }

    # ─── Backend API (proxied to Docker gateway on port 5000) ────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Gzip for Flutter assets ──────────────────────────────────────────────
    gzip on;
    gzip_types text/plain application/javascript application/wasm
               application/json text/css image/svg+xml;
    gzip_min_length 1024;

    # ─── Cache static assets ─────────────────────────────────────────────────
    location ~* \.(js|wasm|css|png|jpg|jpeg|gif|ico|mp4|otf|ttf|frag)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
